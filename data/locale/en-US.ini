GeneralHelp="Vertical Shorts extends OBS with a dedicated vertical canvas dock and a Vertical Production dock (scenes, sources, transitions). Vertical Sources uses an OBS-style list (+/− only; right-click for Properties, Filters, Transform, and other actions). Use View → Docks to show them."
AudioHelp="Vertical canvas audio is independent from the main OBS program mix (the vertical canvas does not use MIX_AUDIO). Sources on the active Vertical Scene still appear in the OBS mixer when active; vertical live/record capture the vertical program video."
AboutHelp="Professional Vertical Streaming Plugin for OBS Studio. Independent vertical scenes, sources, transitions, recording, clips, and streaming destinations — without changing your horizontal production."

